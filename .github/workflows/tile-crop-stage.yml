name: Tile crop-stage raster from scratch

# Merges + tiles an already-exported crop-stage GeoTIFF (its raw parts
# uploaded to a B2 scratch prefix ahead of time) and writes the resulting
# tiles + DB row. Exists because this step is memory-heavy enough (a
# multi-GB province-scale raster) to reliably exhaust RAM on a local
# laptop; GitHub's runners have more headroom to spare for a one-off job
# like this.
on:
  workflow_dispatch:
    inputs:
      date_str:
        description: "Date string matching the scratch prefix, e.g. 20260823"
        required: true
      dominant_stage:
        description: "Dominant stage (1-5), optional"
        required: false
      stage_pixel_counts_json:
        description: 'Stage pixel-count histogram as JSON, e.g. {"1": 123, "2": 456}, optional'
        required: false

jobs:
  tile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Merge, tile, and upload
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: "False"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_REGION: ${{ secrets.B2_REGION }}
        run: |
          python scripts/ci_tile_from_scratch.py \
            "${{ inputs.date_str }}" \
            "${{ inputs.dominant_stage }}" \
            '${{ inputs.stage_pixel_counts_json }}'
